<title>Nooras Boutique LK | Siyana'z Dress Shop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root {
  --bg:#100d0d;
  --bg2:#241918;
  --rose:#c9907b;
  --rose2:#e6b4a3;
  --cream:#faf3eb;
  --muted:#c9b9ae;
  --line:rgba(230,180,163,.25);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:"DM Sans",sans-serif}
body{
  min-height:100svh;
  background:
    radial-gradient(circle at 85% 5%, rgba(201,144,123,.18), transparent 30%),
    radial-gradient(circle at 10% 95%, rgba(201,144,123,.12), transparent 28%),
    linear-gradient(145deg,var(--bg2),var(--bg) 55%,#0b0909);
}
.shell{min-height:100svh;display:flex;justify-content:center;padding:24px 16px 30px}
.card{
  width:100%;max-width:470px;position:relative;overflow:hidden;
  padding:30px 22px 25px;border:1px solid var(--line);border-radius:34px;
  background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  box-shadow:0 28px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(14px);
}
.card:before{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(201,144,123,.18);border-radius:50%;right:-125px;top:-115px;box-shadow:0 0 0 22px rgba(201,144,123,.035),0 0 0 52px rgba(201,144,123,.018)}
.top{position:relative;text-align:center}
.logo{width:122px;height:122px;object-fit:contain;display:block;margin:0 auto 18px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
h1{margin:0;font-family:"Playfair Display",serif;font-size:31px;line-height:1.12;letter-spacing:.045em;font-weight:600}
.tag{margin:10px 0 0;color:var(--rose2);font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
.location{margin:13px 0 0;color:var(--muted);font-family:"Playfair Display",serif;font-size:15px;font-style:italic}
.divider{width:58px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--rose),transparent)}
.heading{margin:27px 0 11px;text-align:center;color:#ddc9bd;font-size:10px;font-weight:700;letter-spacing:.25em;text-transform:uppercase}
.links{display:grid;gap:11px}
.btn{
  min-height:60px;width:100%;display:flex;align-items:center;justify-content:flex-start;gap:15px;
  padding:14px 22px;border-radius:17px;border:1px solid rgba(255,255,255,.08);
  text-decoration:none;transition:.18s ease;box-shadow:0 8px 20px rgba(0,0,0,.14)
}
.btn:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(0,0,0,.24)}
.btn:active{transform:scale(.985)}
.icon{width:21px;height:21px;display:block;flex:0 0 auto}
.label-group{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;line-height:1.28;gap:1px;margin-right:36px}
.label{font-size:15px;font-weight:700;letter-spacing:.025em}
.btn>.label{flex:1 1 auto;text-align:center;margin-right:36px}
.count{font-size:10.5px;font-weight:600;letter-spacing:.03em;opacity:.72}
.insta{background:linear-gradient(135deg,#d9a08d,#bd7f6c);color:#1b1110}
.tiktok{background:#faf3eb;color:#1a1211}
.fb{background:#302321;color:#faf3eb;border-color:rgba(230,180,163,.2)}
.google{background:#faf3eb;color:#1a1211}
.call{background:linear-gradient(135deg,#1d1716,#120f0f);color:var(--rose2);border-color:rgba(201,144,123,.45)}
.icon-logo{width:24px;height:24px;display:block;flex:0 0 auto;border-radius:6px;overflow:hidden}
.small{margin:21px 0 0;text-align:center;color:#9d837a;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.footer{margin-top:25px;padding-top:17px;border-top:1px solid rgba(255,255,255,.07);text-align:center;color:#9e8b83;font-size:10px;line-height:1.6}
@media(max-width:380px){
 .card{padding:26px 18px 22px;border-radius:28px}
 .logo{width:105px;height:105px}
 h1{font-size:27px}
 .btn{min-height:56px}
}
</style>

})();
</script>
